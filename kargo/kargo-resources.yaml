# ==========================================================================
#  Kargo lab kaynakları — proje: kargo-lab
#  Kargo 1.11.2 şemasına göre üretildi.
#
#  ⚠️ 1.11 SÜRÜM NOTU: ImageSubscription'da `semverConstraint` alanı
#     KALDIRILDI; yerine `constraint` geldi. Ayrıca `allowTags` (tekil)
#     v1.11.0'dan itibaren artifact discovery'yi HATA ile düşürüyor
#     (yerine `allowTagsRegexes` listesi kullanılır).
# ==========================================================================
---
# --------------------------------------------------------------------------
# ProjectConfig: hangi Stage'in otomatik promote edileceğini belirler.
# dev -> autoPromotionEnabled: true
# prod BİLİNÇLİ OLARAK listelenmedi => manuel promotion (varsayılan kapalı).
# --------------------------------------------------------------------------
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-lab
  namespace: kargo-lab
spec:
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true
---
# --------------------------------------------------------------------------
# Warehouse: nginx imajını izler, yeni sürüm bulunca Freight üretir.
# interval: 1m -> lab'de Warehouse polling gecikmesini kısaltmak için.
#   (Üretimde 5m+ tercih edilir; registry rate limit'lerine dikkat.)
# --------------------------------------------------------------------------
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: nginx
  namespace: kargo-lab
spec:
  interval: 1m
  freightCreationPolicy: Automatic
  subscriptions:
    - image:
        repoURL: public.ecr.aws/nginx/nginx
        imageSelectionStrategy: SemVer
        # 1.11'de bu alanın adı `constraint` (eski adı semverConstraint)
        # Bilinçli olarak <1.29.0'a daraltıldı: dev'i 1.28.3'te tutmak için.
        # autoPromotionEnabled: true olduğundan, constraint 1.31.4'e izin
        # verdiği sürece dev kendiliğinden oraya fırlar; en yeni artefaktı
        # 1.28.3 yapmanın tek yolu constraint'i kısmak.
        # Yükseliş akışını tekrar görmek için burayı <1.32.0'a genişlet.
        constraint: ">=1.27.0 <1.29.0"
        strictSemvers: true
        discoveryLimit: 20

    # ----------------------------------------------------------------------
    # Git subscription: config repo'nun kendisi izlenir.
    #
    # ⚠️ SONSUZ DÖNGÜ TUZAĞI: Kargo promotion sırasında BU repo'ya commit
    #    atıyor. Filtresiz bir git subscription'da zincir şöyle kilitlenir:
    #      promotion -> main'e commit -> yeni Freight -> dev autoPromotion
    #      -> promotion -> ... (interval 1m, dakikada bir commit)
    #
    #    Çözüm: includePaths ile SADECE `base` izlenir. Kargo'nun yazdığı
    #    yollar (env/dev, env/prod) allowlist dışında kaldığı için promotion
    #    commit'leri Freight üretmez ve döngü kapanır.
    #
    #    Ön ek yoksa desen "base directory" olarak yorumlanır:
    #    `base` -> base/deployment.yaml, base/service.yaml ... eşleşir.
    #    (glob: ve regex: ön ekleri de destekli.)
    #
    #    Anlamı: base/ altındaki ortak manifest değişiklikleri artık Freight
    #    üretir ve dev -> prod hattından akar.
    # ----------------------------------------------------------------------
    - git:
        repoURL: https://github.com/kocagozhkn/kargo-lab-config.git
        branch: main
        commitSelectionStrategy: NewestFromBranch
        discoveryLimit: 20
        includePaths:
          - base
---
# --------------------------------------------------------------------------
# Stage: dev
#   Freight kaynağı: doğrudan Warehouse'tan (sources.direct: true)
#   Akış: git-clone -> kustomize-set-image -> git-commit -> git-push
#         -> argocd-update
#   Doğrudan main branch'ine push eder, PR yok.
# --------------------------------------------------------------------------
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo-lab
spec:
  vars:
    - name: gitRepo
      value: https://github.com/kocagozhkn/kargo-lab-config.git
    - name: imageRepo
      value: public.ecr.aws/nginx/nginx
  requestedFreight:
    - origin:
        kind: Warehouse
        name: nginx
      sources:
        direct: true

  # --------------------------------------------------------------------------
  # ⚠️ BU BLOK CLUSTER'DA ELLE EKLENMİŞTİ, GIT'TE YOKTU.
  #    Buraya alınmasının nedeni: dosya olduğu gibi apply edilirse
  #    verification ayarı sessizce SİLİNİYORDU.
  #    AnalysisTemplate/smoke-check kaynağının kendisi hâlâ yalnızca
  #    cluster'da duruyor; bu dosyada tanımlı değil.
  # --------------------------------------------------------------------------
  verification:
    analysisTemplates:
      - name: smoke-check

  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./src

        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./src/env/dev
            images:
              # Kargo 1.11: images[] açıkça verildiğinde `tag` VEYA `digest`
              # zorunlu (şemadaki oneOf). Tag'i Freight'ten imageFrom() ile
              # okuyoruz.
              - image: ${{ vars.imageRepo }}
                tag: ${{ imageFrom(vars.imageRepo).Tag }}

        - uses: git-commit
          as: commit
          config:
            path: ./src
            # kustomize-set-image'in ürettiği hazır commit mesajı
            message: ${{ outputs['update-image'].commitMessage }}

        - uses: git-push
          as: push
          config:
            path: ./src
            provider: github
            targetBranch: main

        - uses: argocd-update
          config:
            apps:
              - name: kargo-lab-dev
                namespace: argocd
                sources:
                  # repoURL, Argo CD Application'ın source.repoURL'i ile
                  # BİREBİR aynı olmalı; yoksa adım eşleşme bulamaz.
                  - repoURL: ${{ vars.gitRepo }}
                    # ⚠️ GIT SUBSCRIPTION EKLENDİĞİ İÇİN ARTIK ZORUNLU.
                    # Şema: "If left undefined, the desired revision will be
                    # determined by Freight (if possible)." Freight artık git
                    # commit'i taşıdığından, boş bırakılırsa health check o
                    # commit'i bekler; ama Application hâlâ main HEAD'i
                    # izlediği için bir sonraki promotion main'i ilerletince
                    # Stage kalıcı Unhealthy'ye düşer (dosyanın eski
                    # yorumunda anlatılan senaryo tam olarak bu).
                    #
                    # Çözüm: revizyonu bu promotion'ın kendi push'una sabitle
                    # ve targetRevision'ı da oraya yaz. Böylece Application
                    # main HEAD'i takip etmeyi bırakır, Kargo'nun beklediği
                    # commit ile Argo CD'nin senkronladığı commit aynı olur.
                    desiredRevision: ${{ outputs.push.commit }}
                    # updateTargetRevision olmadan desiredRevision yalnızca
                    # health check'i etkiler, Application'ı sabitlemez.
                    updateTargetRevision: true
---
# --------------------------------------------------------------------------
# Stage: prod
#   Freight kaynağı: upstream dev (sources.stages: [dev])
#   ProjectConfig'te listelenmediği için promotion MANUEL tetiklenir.
#   Akış: git-clone -> kustomize-set-image -> git-commit
#         -> git-push (generateTargetBranch: true, ayrı branch)
#         -> git-open-pr -> git-wait-for-pr -> argocd-update
#
#   ⚠️ provider: github  (repo GitHub'da barındığı için. Repo GitLab'a
#      taşınırsa bu 3 yerdeki değeri `gitlab` yapmak gerekir:
#      git-push, git-open-pr, git-wait-for-pr)
# --------------------------------------------------------------------------
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-lab
spec:
  vars:
    - name: gitRepo
      value: https://github.com/kocagozhkn/kargo-lab-config.git
    - name: imageRepo
      value: public.ecr.aws/nginx/nginx
  requestedFreight:
    - origin:
        kind: Warehouse
        name: nginx
      sources:
        direct: false
        stages:
          - dev
  # --------------------------------------------------------------------------
  # Inline step'ler yerine ortak PromotionTask kullanılıyor.
  # openPR=true -> ayrı branch'e push + PR aç + merge bekle.
  # Task, PR gerçekten açılmadığında (diff yoksa git-open-pr skip edilir)
  # wait-for-pr adımını da atlayacak guard'ı içeriyor.
  # --------------------------------------------------------------------------
  promotionTemplate:
    spec:
      steps:
        - task:
            name: standard-gitops-update
          vars:
            - name: gitRepo
              value: https://github.com/kocagozhkn/kargo-lab-config.git
            - name: imageRepo
              value: public.ecr.aws/nginx/nginx
            - name: envPath
              value: ./src/env/prod
            - name: argocdApp
              value: kargo-lab-prod
            - name: openPR
              value: "true"
