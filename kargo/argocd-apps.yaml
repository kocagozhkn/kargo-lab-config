# ==========================================================================
#  Argo CD Applications — Kargo tarafından yönetilir
#
#  ⚠️ BU DOSYAYI APPLY ETMEK targetRevision'I SIFIRLAR.
#     Stage'lerin argocd-update adımı `updateTargetRevision: true` ile
#     Application'ın targetRevision'ını promote edilen commit'e sabitliyor.
#     Bu dosyada ise `main` yazıyor. Dolayısıyla cluster ile git arasındaki
#     targetRevision farkı DRIFT DEĞİL, normal çalışma durumudur.
#     Dosyayı yeniden apply ederseniz sabitleme bozulur ve Application
#     tekrar main HEAD'ini takip etmeye başlar.
#     Kontrol: kubectl -n argocd get app -o custom-columns=\
#       'NAME:.metadata.name,REV:.spec.source.targetRevision'
#
#  ⚠️ EN SIK YAPILAN HATA: kargo.akuity.io/authorized-stage annotation'ı.
#     Bu annotation olmadan Kargo'nun argocd-update adımı şu hatayla düşer:
#       "Argo CD Application ... does not permit mutation by Kargo Stage ..."
#     Format: <project>:<stage>
# ==========================================================================
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-lab-dev
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-lab:dev
spec:
  project: default
  source:
    # Kargo'nun argocd-update adımındaki repoURL ile BİREBİR aynı olmalı
    repoURL: https://github.com/kocagozhkn/kargo-lab-config.git
    targetRevision: main
    path: env/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-lab-prod
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-lab:prod
spec:
  project: default
  source:
    repoURL: https://github.com/kocagozhkn/kargo-lab-config.git
    targetRevision: main
    path: env/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
