# ==========================================================================
#  AnalysisTemplate'ler — dev Stage'in verification adımı bunları çağırır.
#
#  Bu kaynak bir süre YALNIZCA cluster'da elle oluşturulmuş halde durdu,
#  git'te karşılığı yoktu. Drift'i kapatmak için buraya alındı.
# ==========================================================================
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke-check
  namespace: kargo-lab
spec:
  metrics:
    # nginx-dev'deki TÜM nginx pod'larının sağlıklı olmasını şart koşar.
    - name: nginx-healthy
      count: 3
      interval: 15s
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          # min() kritik: promotion sırasında eski ve yeni pod bir süre
          # birlikte yaşıyor. Ham `nginx_up` iki seri döndürür ve
          # result[0] rastgele birini seçerdi; min() hepsinin 1 olmasını
          # zorunlu kılar.
          #
          # `or vector(0)` da kritik: hiç nginx pod'u yoksa min() boş vektör
          # döner, result[0] patlar ve ölçüm temiz bir "Failed" yerine
          # "Error" verir. vector(0) fallback'i ile pod yokluğu net biçimde
          # 0'a, yani başarısızlığa çevrilir.
          query: min(nginx_up{namespace="nginx-dev"}) or vector(0)
      successCondition: result[0] == 1
