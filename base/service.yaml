apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
    # Keşif pod annotation'ı üzerinden yürüyor; bu port elle kontrol
    # (curl nginx:9113/metrics) ve ileride ServiceMonitor'a geçiş için.
    - name: metrics
      port: 9113
      targetPort: metrics
